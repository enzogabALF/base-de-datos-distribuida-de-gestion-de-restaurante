services:
  mysql-nodo1:
    image: mysql:8.0
    container_name: restaurante_nodo1_salon
    hostname: nodo1-salon
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_ae4
      MYSQL_DATABASE: restaurante_db
      MYSQL_USER: app_salon
      MYSQL_PASSWORD: salon_password_ae4
      TZ: America/Argentina/Buenos_Aires
    command:
      - --server-id=1
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --auto-increment-increment=2
      - --auto-increment-offset=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --log-slave-updates=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      # Fase 2: nivel 3 (Note) para que el log muestre la recuperación ante caída de InnoDB (redo/undo)
      - --log-error-verbosity=3
      - --plugin-load-add=semisync_master.so
      - --plugin-load-add=semisync_slave.so
      - --loose-rpl-semi-sync-master-enabled=1
      - --loose-rpl-semi-sync-slave-enabled=1
      - --loose-rpl-semi-sync-master-wait-point=AFTER_SYNC
      - --loose-rpl-semi-sync-master-timeout=3000
    volumes:
      - ./nodo1/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./nodo1/init:/docker-entrypoint-initdb.d:ro
      - ./nodo1/data:/var/lib/mysql
    networks:
      restaurante_net:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_ae4"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-nodo2:
    image: mysql:8.0
    container_name: restaurante_nodo2_cocina
    hostname: nodo2-cocina
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_ae4
      MYSQL_DATABASE: restaurante_db
      MYSQL_USER: app_cocina
      MYSQL_PASSWORD: cocina_password_ae4
      TZ: America/Argentina/Buenos_Aires
    command:
      - --server-id=2
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --auto-increment-increment=2
      - --auto-increment-offset=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --log-slave-updates=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      # Fase 2: nivel 3 (Note) para que el log muestre la recuperación ante caída de InnoDB (redo/undo)
      - --log-error-verbosity=3
      - --plugin-load-add=semisync_master.so
      - --plugin-load-add=semisync_slave.so
      - --loose-rpl-semi-sync-master-enabled=1
      - --loose-rpl-semi-sync-slave-enabled=1
      - --loose-rpl-semi-sync-master-wait-point=AFTER_SYNC
      - --loose-rpl-semi-sync-master-timeout=3000
    volumes:
      - ./nodo2/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./nodo2/init:/docker-entrypoint-initdb.d:ro
      - ./nodo2/data:/var/lib/mysql
    networks:
      restaurante_net:
        ipv4_address: 172.28.0.12
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_ae4"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FASE 2 - Conmutación por error automática (failover).
  # Las aplicaciones se conectan a HAProxy y no a un nodo fijo:
  #   3310 = Salón/Caja (Nodo 1, respaldo Nodo 2)
  #   3311 = Cocina/Stock (Nodo 2, respaldo Nodo 1)
  #   8404 = panel web de estado (http://localhost:8404)
  # ---------------------------------------------------------------------------
  haproxy:
    image: haproxy:2.8-alpine
    container_name: restaurante_haproxy
    hostname: haproxy
    restart: unless-stopped
    depends_on:
      - mysql-nodo1
      - mysql-nodo2
    ports:
      - "3310:3310"
      - "3311:3311"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      restaurante_net:
        ipv4_address: 172.28.0.20

  # ---------------------------------------------------------------------------
  # FASE 2 - Respaldos automáticos (completo / diferencial / incremental) y
  # restauración verificada en una instancia aislada (puerto 3309).
  # Los respaldos quedan en ./backups (fuera del control de versiones).
  # ---------------------------------------------------------------------------
  backup:
    build: ./backup
    image: restaurante-backup:8.0.46
    container_name: restaurante_backup
    hostname: backup
    restart: unless-stopped
    depends_on:
      - mysql-nodo1
      - mysql-nodo2
    environment:
      TZ: America/Argentina/Buenos_Aires
      BACKUP_USER: backup_user
      BACKUP_PASSWORD: backup_password_ae4
      NODOS: "nodo1:172.28.0.11 nodo2:172.28.0.12"
      FULL_CADA_MIN: "1440"
      DIFERENCIAL_CADA_MIN: "360"
      INCREMENTAL_CADA_MIN: "15"
      RETENCION_DIAS: "7"
    ports:
      - "3309:3309"
    volumes:
      - ./backup/scripts:/opt/backup:ro
      - ./backups:/backups
    networks:
      restaurante_net:
        ipv4_address: 172.28.0.30

networks:
  restaurante_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
