# ============================================================================
# AE4 - TIFAS FASE 2: BALANCEADOR CON CONMUTACIÓN POR ERROR AUTOMÁTICA (FAILOVER)
# ----------------------------------------------------------------------------
# Las aplicaciones NO se conectan directo a un nodo, sino a un punto de entrada
# lógico por área. HAProxy verifica la salud de cada nodo cada 2 s y, si el nodo
# principal del área deja de responder 3 veces seguidas (~6 s), redirige las
# conexiones nuevas al nodo de respaldo. Cuando el principal vuelve (3 chequeos
# OK), el tráfico regresa a él (failback) y se cortan las sesiones del respaldo.
#
#   Puerto 3310 (Salón/Caja)    -> principal: Nodo 1 | respaldo: Nodo 2
#   Puerto 3311 (Cocina/Stock)  -> principal: Nodo 2 | respaldo: Nodo 1
#   Puerto 8404                 -> panel web de estado (http://localhost:8404)
#
# Cada área escribe en un único nodo a la vez ("single writer" por área), lo que
# respeta la fragmentación funcional del diseño y evita conflictos de escritura.
# ============================================================================

global
    log stdout format raw local0 info
    # API de administración en tiempo de ejecución (solo dentro de la red Docker).
    # La usa pruebas_fase2/switchover.sh para el switchover planificado.
    stats socket ipv4@0.0.0.0:9999 level admin
    stats timeout 30s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 3s
    timeout client 8h
    timeout server 8h
    timeout check 1s
    # inter 2s: intervalo de chequeo normal
    # fastinter 500ms: tras el primer fallo se chequea cada 0,5 s para confirmar rápido la caída
    # fall 3: caído tras 3 fallos seguidos | rise 3: activo tras 3 éxitos seguidos
    # on-marked-down shutdown-sessions: al caer un nodo se cortan sus sesiones para que
    # los clientes reconecten de inmediato contra el respaldo.
    default-server inter 2s fastinter 500ms fall 3 rise 3 on-marked-down shutdown-sessions

listen salon
    bind *:3310
    # Chequeo de protocolo MySQL real (handshake + login), no solo TCP.
    option mysql-check user haproxy_check post-41
    server nodo1 172.28.0.11:3306 check on-marked-up shutdown-backup-sessions
    server nodo2 172.28.0.12:3306 check backup

listen cocina
    bind *:3311
    option mysql-check user haproxy_check post-41
    server nodo2 172.28.0.12:3306 check on-marked-up shutdown-backup-sessions
    server nodo1 172.28.0.11:3306 check backup

listen estadisticas
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
